# Le clip gia montate finiscono anche su YouTube Shorts.
#
# Non rimonta niente: i file sono gia su R2, si scaricano e si caricano.
# Chi e gia salito resta segnato nello stato, quindi il workflow si puo
# rilanciare senza sdoppiare niente — e serve, perche la quota di YouTube
# e giornaliera (cento caricamenti) e un recupero grosso puo spezzarsi.
#
# Quante caricarne al giorno sta in config.yaml (shorts.al_giorno): quattro
# finche c'e arretrato, poi la regola non cambia e diventano da sole le due
# al giorno di Instagram, perche altre non ce ne sono.

name: "Reels Factory · Shorts"

on:
  schedule:
    # Una passata al giorno basta: carica tutte quelle che gli spettano.
    # 06:00 UTC, prima che Instagram pubblichi: cosi l'arretrato scala
    # anche nei giorni in cui la pubblicazione salta.
    - cron: "0 6 * * *"
    # Riserva, per i ritardi di GitHub. Il tetto giornaliero e nel codice:
    # questi turni non raddoppiano niente, recuperano solo quelli persi.
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      quante:
        description: "Quante caricare adesso (vuoto = come da config)"
        required: false
        default: ""

concurrency:
  group: reels-factory-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze Python
        working-directory: reels-factory
        # requirements.txt, non un elenco scelto a mano. Il primo tentativo
        # installava solo requests, PyYAML e boto3 — quelli che SERVONO a
        # caricare — ed e morto su "No module named anthropic": src/main.py
        # importa tutti i moduli in cima, anche quelli che questo comando non
        # usa. Un elenco curato a mano si rompe ogni volta che qualcuno
        # aggiunge un import da un'altra parte.
        run: pip install -r requirements.txt

      - name: Carica su Shorts
        working-directory: reels-factory
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # R2: le clip da caricare stanno li. Senza questi il passo non
          # riesce nemmeno a chiedere l'indirizzo del file — e il 25/09 ha
          # saltato tutte e 37 le clip dicendo «non ricavo l'indirizzo
          # ('R2_ACCOUNT_ID')».
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: python -u -m src.main shorts "${{ inputs.quante }}"

      - name: Commit dello stato aggiornato
        run: |
          git config user.name "reels-factory-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A reels-factory/state
          if git diff --cached --quiet; then
            echo "Nessuna modifica allo stato"
            exit 0
          fi
          git commit -m "Reels Factory: clip salite su Shorts [skip ci]"
          for tentativo in 1 2 3; do
            if git push; then
              echo "Stato salvato al tentativo ${tentativo}"
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((tentativo * 5))
          done
          echo "::error::Le clip sono su YouTube ma lo stato non e stato salvato"
          exit 1
