# Reels Factory — NICCHIA
# Va a vedere quali video brevi italiani del settore hanno fatto numeri veri e
# ne estrae gli schemi ricorrenti. Il risultato (nicchia.md) viene letto dal
# prompt di selezione a ogni lavorazione: e la scuola del sistema.
#
# Non serve nessuna chiave e non si paga niente: legge gli elenchi pubblici di
# YouTube — la ricerca e la scheda "Shorts" di un canale — con yt-dlp. Sono le
# uniche due porte che rispondono da un runner: l'estrazione del singolo video
# da qui viene rifiutata, gli elenchi no. E dagli elenchi arrivano titoli e
# views, che sono esattamente cio che serve.
#
# Una volta a settimana basta: gli schemi di costruzione non cambiano di giorno
# in giorno, e ogni giro aggiunge la sua vendemmia allo storico invece di
# ricominciare da capo.

name: "Reels Factory · Nicchia"

on:
  schedule:
    # ogni lunedi alle 06:40 UTC
    - cron: "40 6 * * 1"
  workflow_dispatch:

concurrency:
  group: reels-factory-nicchia
  cancel-in-progress: false

jobs:
  nicchia:
    runs-on: ubuntu-latest
    # Quaranta canali con due secondi di pausa fra una lettura e l'altra: si
    # sta abbondantemente dentro, ma senza fretta e senza raffiche.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze Python
        working-directory: reels-factory
        # main.py importa tutti i moduli in cima, compreso storage (boto3):
        # servono le dipendenze complete, non solo quelle di questo comando.
        run: pip install -r requirements.txt

      - name: Cerca cosa sfonda nella nicchia
        working-directory: reels-factory
        env:
          # L'unico segreto necessario: serve a distillare gli schemi, non a
          # leggere YouTube. La lettura non costa niente e non chiede permessi.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.main nicchia

      - name: Commit delle schede aggiornate
        run: |
          git config user.name "reels-factory-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Lo storico va commesso insieme alla scheda: e la memoria della
          # scuola, e senza di lui ogni lunedi ripartirebbe da sedici video.
          git add reels-factory/nicchia.md reels-factory/state/scuola.json
          if git diff --cached --quiet; then
            echo "Schede invariate"
            exit 0
          fi
          git commit -m "Scuola della nicchia aggiornata [skip ci]"
          # Il push puo perdere la corsa contro il workflow di pubblicazione,
          # che scrive nella stessa cartella state/. Si riprova rifondendo.
          for tentativo in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Tentativo $tentativo non riuscito, riprovo"
            sleep $((tentativo * 5))
          done
          echo "::error::Non sono riuscito a pubblicare le schede aggiornate"
          exit 1
