# Reels Factory — PUBLISH
# Pubblica su Instagram le prossime clip in coda. Dal 25/09 sono DUE al
# giorno (richiesta di Lorenzo), distanziate di almeno cinque ore.
#
# Quanti al giorno e quanto distanziati NON stanno qui: stanno in
# config.yaml (instagram.al_giorno e instagram.distanza_minima_ore). Questi
# turni sono solo occasioni — il codice decide se e il momento. Ce ne sono
# piu del necessario apposta: GitHub consegna le esecuzioni programmate con
# ritardi anche di otto ore, e con pochi turni un ritardo fa saltare il
# secondo Reel della giornata.

name: "Reels Factory · Publish"

on:
  schedule:
    # 07:30 UTC = 09:30 ora italiana (estate). Primo Reel della giornata.
    - cron: "30 7 * * *"
    - cron: "30 9 * * *"
    # 13:30 UTC = 15:30 italiane: qui cade il secondo, a sei ore dal primo.
    - cron: "30 11 * * *"
    - cron: "30 13 * * *"
    - cron: "30 15 * * *"
    - cron: "30 17 * * *"
    # Ultima occasione prima che si chiuda la finestra delle 22 italiane.
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (non pubblica davvero)"
        type: boolean
        default: false
      force:
        description: "Pubblica anche se ne e gia uscito uno oggi"
        type: boolean
        default: false

concurrency:
  group: reels-factory-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze Python
        working-directory: reels-factory
        run: pip install -r requirements.txt

      - name: Pubblica la prossima clip in coda
        working-directory: reels-factory
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          PUBLISH_FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python -u -m src.main publish

      # Il 28/08 il Reel e uscito ma questo passo e fallito: la lavorazione
      # aveva scritto sul repo nel frattempo e il rebase e finito in conflitto
      # sullo stesso file di stato. Il sistema credeva la clip ancora in coda e
      # l'avrebbe ripubblicata il giorno dopo, in doppio.
      # Ora non si tenta piu di fondere due versioni del file: si riparte dallo
      # stato aggiornato di origin e si riapplica la sola ricevuta di questa
      # pubblicazione, che e idempotente. Fino a tre giri.
      - name: Commit dello stato aggiornato
        run: |
          git config user.name "reels-factory-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for tentativo in 1 2 3; do
            git add reels-factory/state/queue.json
            if git diff --cached --quiet; then
              echo "Nessuna modifica allo stato"
              exit 0
            fi
            git commit -m "Reels Factory: stato aggiornato dopo publish [skip ci]"
            if git push; then
              echo "Stato salvato al tentativo ${tentativo}"
              exit 0
            fi
            echo "Push rifiutato: riparto dallo stato aggiornato e riapplico la ricevuta"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            (cd reels-factory && python -u -m src.main registra)
          done
          echo "::error::Stato non salvato dopo 3 tentativi — il Reel e comunque uscito"
          exit 1
