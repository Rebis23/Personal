# Reels Factory — INGEST
# Controlla se è uscito un nuovo video sul canale YouTube; se sì lo scarica,
# fa scegliere a Claude i momenti migliori, monta le clip verticali con
# sottotitoli e le mette in coda di pubblicazione (stato committato nel repo).

name: "Reels Factory · Ingest"

on:
  schedule:
    # Controllo principale: 16:00 UTC = 18:00 ora italiana (estate) / 17:00 (inverno)
    - cron: "0 16 * * *"
    # Reti di sicurezza: se il download fallisce (YouTube blocca gli actor a
    # ondate) il video viene ripreso in automatico, senza aspettare 24 ore.
    # Se non c'è nulla da fare, il run finisce in 30 secondi.
    - cron: "0 20 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      clips_per_video:
        description: "Quante clip estrarre da questo video (vuoto = come da config)"
        required: false
        default: ""
      force_archive:
        description: "1 = pesca dall'archivio ignorando attesa e soglia sulla coda"
        required: false
        default: ""
      senza_warp:
        description: "1 = niente tunnel WARP (prova se YouTube passa lo stesso)"
        required: false
        default: ""


concurrency:
  group: reels-factory-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Un video da 24 minuti ne ha richiesti 62 (24/08, tre clip). Le
    # infornate a mano ne chiedono cinque per video e ogni clip costa una
    # dozzina di minuti fra montaggio e Remotion: il tetto va tenuto largo.
    # E solo un massimale — i run che non trovano nulla durano un minuto.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # WARP: la VPN gratuita di Cloudflare. E il pezzo che fa cadere il
      # muro anti-bot di YouTube — provato il 30/08, senza di lui la catena
      # dei client non basta. Nessun account, nessuna carta: wgcf registra
      # un dispositivo anonimo e genera una configurazione WireGuard.
      #
      # continue-on-error e timeout non sono prudenza generica: al primo
      # giro nella fabbrica questo passo si e piantato per minuti (apt in
      # attesa del lock di unattended-upgrades) e avrebbe bruciato i 110
      # minuti del job senza produrre niente. Se WARP non si alza, il
      # lavoro prosegue senza: si torna a com'era prima, non ci si ferma.
      # I pacchetti si installano UNA VOLTA SOLA, qui. Prima erano due apt
      # separati — uno in questo passo per wireguard, uno dopo per ffmpeg —
      # e il 4/09 si sono pestati i piedi: ffmpeg ci ha messo DIECI MINUTI
      # aspettando il lock di unattended-upgrades, e nel frattempo l'apt di
      # WARP moriva in 22 secondi. Senza WARP YouTube ributta giu il
      # download, e il run e finito senza fare niente sembrando riuscito.
      - name: Installa i pacchetti di sistema
        timeout-minutes: 12
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update -qq
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y -qq --no-install-recommends \
            wireguard-tools ffmpeg fonts-dejavu-core
          wg --version && ffmpeg -version | head -1

      # Il tunnel si PREPARA qui e si alza altrove: lo accende src/tunnel.py
      # per i pochi minuti in cui yt-dlp scarica, e lo smonta subito. Prima
      # restava su per tutti i cinquanta minuti del lavoro, e in quel tempo
      # Cloudflare poteva tagliare fuori il runner da GitHub — quattro volte
      # in due giorni, di cui una con il runner tolto di mezzo a meta lavoro.
      # Contro quel guasto non c'e tetto che tenga: a rompersi e il canale
      # con cui il runner riferisce, e un tetto ha bisogno di qualcuno che lo
      # faccia rispettare. L'unica difesa e stare esposti per meno tempo.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache PO token provider
        uses: actions/cache@v4
        with:
          path: /tmp/bgutil
          key: bgutil-pot-provider-1.3.2

      # Provider comunitario dei "PO token" (Brainicism/bgutil-ytdlp-pot-provider):
      # genera i token che YouTube richiede per servire i flussi video.
      # Il server resta attivo in background per tutta la durata del job.
      # Si compila qui, sulla rete normale: clona da GitHub e tira giu i
      # pacchetti npm, due cose che dentro il tunnel si piantano.
      - name: Compila il PO token provider
        run: |
          if [ ! -f /tmp/bgutil/server/build/main.js ]; then
            git clone --depth 1 --branch 1.3.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
            cd /tmp/bgutil/server && npm ci --silent && npx tsc
          fi

      - name: Cache modello Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      # Remotion: il motore che disegna le caption animate premium.
      # Il browser headless che usa per il rendering finisce dentro
      # node_modules, quindi la cache copre anche quello.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Remotion
        uses: actions/cache@v4
        with:
          path: reels-factory/remotion/node_modules
          key: remotion-${{ hashFiles('reels-factory/remotion/package-lock.json') }}

      - name: Installa Remotion
        working-directory: reels-factory/remotion
        run: |
          if [ ! -d node_modules/remotion ]; then
            npm ci --no-audit --no-fund
          fi
          npx remotion browser ensure

      - name: Installa dipendenze Python
        working-directory: reels-factory
        run: pip install -r requirements.txt

      # L'ORDINE DEI PASSI E' PARTE DEL MECCANISMO, NON UN DETTAGLIO.
      # Tutto quello che scarica da GitHub, npm o PyPI viene PRIMA e va
      # sulla rete normale: dentro il tunnel di Cloudflare quei download si
      # piantano — il 5/09 hanno ucciso due run, una col runner tolto di
      # mezzo (98) e una con Deno che non arrivava (110).
      #
      # Il tunnel si alza solo qui in fondo, subito prima del provider del
      # PO token, perche il lasciapassare va coniato dallo stesso IP da cui
      # poi esce la richiesta a YouTube (run 109). Poi c'e lo scarico, e
      # main.py abbassa il tunnel appena finito.
      #
      # In sostanza: prima ci si prepara sulla rete di casa, poi si entra
      # nel tunnel per il tempo strettamente necessario a parlare con
      # YouTube, e si esce.

      - name: Prepara il tunnel WARP
        id: warp
        # Il tetto del passo non basta. Il 5/09 (run 99) questo passo e
        # rimasto appeso mezz'ora con timeout-minutes: 5 scritto sopra:
        # quando il tunnel taglia fuori il runner, chi dovrebbe far
        # scattare il tetto e dall'altra parte del taglio. Percio ogni
        # comando qui sotto ha il suo "timeout" locale, che e il sistema
        # operativo del runner a far rispettare e non dipende dalla rete.
        if: ${{ github.event.inputs.senza_warp != '1' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          # SENZA QUESTO TOKEN LA RICHIESTA VIENE RIFIUTATA. Il 4/09 (run 90)
          # il passo e morto in cinque secondi: la chiamata all'API di GitHub
          # per sapere l'ultima versione di wgcf era anonima, e i runner
          # escono da IP pubblici condivisi che quel limite lo hanno gia
          # esaurito. V restava vuota, l'URL diventava spazzatura, e da li
          # crollava tutto — senza che nessuno dicesse perche.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          V=$(curl -sf --max-time 30 -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              https://api.github.com/repos/ViRb3/wgcf/releases/latest \
              | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          if [ -z "$V" ]; then
            echo "::warning::Non riesco a sapere quale versione di wgcf scaricare"
            exit 1
          fi
          echo "wgcf ${V}"
          # -f: un 404 o un 403 devono fermare qui, non produrre un file di
          # errore da rendere eseguibile e poi lanciare.
          curl -sfL --max-time 60 -o /tmp/wgcf \
            "https://github.com/ViRb3/wgcf/releases/download/${V}/wgcf_${V#v}_linux_amd64"
          chmod +x /tmp/wgcf

          # TRE TENTATIVI, OGNUNO CON UN DISPOSITIVO NUOVO. Il tunnel riesce
          # circa una volta su due: quando Cloudflare assegna un'uscita da cui
          # GitHub non risponde, il runner resta muto — il 4/09 (run 89) e
          # rimasto appeso 78 minuti tenendo in ostaggio la pubblicazione del
          # giorno, e nemmeno il timeout sul passo e scattato, perche per
          # scattare bisogna essere raggiungibili.
          #
          # Non e un guasto da aspettare: e una lotteria da rigiocare. Ogni
          # "wgcf register" e un dispositivo diverso, quindi un'uscita diversa.
          # Si smonta, si ripesca, si riprova. Se dopo tre giri GitHub non
          # risponde ancora, si tira avanti senza tunnel: il download da
          # YouTube fallira, ma in due minuti e dicendolo.
          alzato=0
          for giro in 1 2 3; do
            rm -f /tmp/wgcf-profile.conf /tmp/wgcf-account.toml
            cd /tmp && timeout 60 ./wgcf register --accept-tos \
                    && timeout 60 ./wgcf generate || { echo '::warning::wgcf non risponde'; continue; }
            sudo cp wgcf-profile.conf /etc/wireguard/warp.conf
            sudo sed -i '/^DNS/d' /etc/wireguard/warp.conf
            sudo timeout 60 wg-quick up warp \
              || { echo '::warning::wg-quick non sale'; sudo timeout 60 wg-quick down warp || true; continue; }
            # LA VERIFICA DEVE ESSERE RAPPRESENTATIVA, non compiacente.
            # Il 5/09 (run 98) questo controllo e passato al primo giro con
            # api.github.com che rispondeva — ma l'IP di uscita stampato era
            # VUOTO, cioe ipify non rispondeva affatto. Il tunnel portava
            # qualcosa e non portava il resto. Sedici minuti dopo il runner
            # e stato tolto di mezzo ("received a shutdown signal") mentre
            # scaricava Deno, e il run e finito senza una clip.
            #
            # Quindi ora passano tutte e tre o si ricomincia: un IP di
            # uscita vero, GitHub, e YouTube — che e poi il motivo per cui
            # il tunnel esiste. Un mezzo tunnel e peggio di nessun tunnel,
            # perche nessuno se ne accorge finche non e troppo tardi.
            # Ogni prova si stampa da sola. Il 5/09 (run 102) i tre giri
            # sono falliti tutti con un IP di uscita valido, e dal log non
            # si capiva QUALE delle prove fosse caduta, perche erano
            # incatenate con &&: un controllo severo che non dice cosa ha
            # bocciato costringe a indovinare come prima.
            uscita=$(curl -s --max-time 20 https://api.ipify.org)
            gh=no; raw=no; yt=no
            curl -sf --max-time 25 -o /dev/null https://api.github.com && gh=si
            curl -sf --max-time 25 -o /dev/null \
              https://raw.githubusercontent.com/ViRb3/wgcf/master/README.md && raw=si
            curl -sf --max-time 25 -o /dev/null https://www.youtube.com && yt=si
            echo "giro ${giro}: uscita=${uscita:-NIENTE} github=${gh} raw=${raw} youtube=${yt}"

            # YouTube NON ha diritto di veto. Un curl nudo alla home di
            # YouTube non e quello che fa yt-dlp — che porta il PO token e
            # si presenta da browser — quindi un "no" qui non dice che lo
            # scarico fallira: dice solo che YouTube non gradisce curl.
            # Quello che conta e che il tunnel porti traffico (un IP di
            # uscita vero) e che il runner resti attaccato a GitHub, che e
            # cio che e mancato nella run 98 quando il runner e stato tolto
            # di mezzo. Se YouTube dice no, si tira avanti e si annota.
            if [ -n "$uscita" ] && [ "$gh" = si ] && [ "$raw" = si ]; then
              [ "$yt" = si ] || echo "::warning::Giro ${giro}: YouTube non risponde a curl, ma il tunnel regge: proseguo"
              echo "Tunnel buono al giro ${giro}: uscita ${uscita}"
              alzato=1
              break
            fi
            echo "::warning::Giro ${giro}: tunnel a meta (uscita=${uscita:-NIENTE} github=${gh} raw=${raw}), riprovo con un altro dispositivo"
            sudo timeout 60 wg-quick down warp || true
          done
          # IL TUNNEL RESTA SU, E NON E' UN RIPENSAMENTO. Il primo disegno
          # lo smontava qui e lo faceva rialzare a src/tunnel.py solo
          # attorno a yt-dlp. Non funziona, e la run 109 dice perche: il
          # lasciapassare anti-bot (PO token) viene coniato all'avvio del
          # suo provider — il passo qui sotto — e YouTube lo lega all'IP da
          # cui e stato chiesto. Coniato dall'IP vero del runner e speso da
          # un IP Cloudflare, non combacia: "Sign in to confirm you're not
          # a bot" anche col tunnel perfettamente su.
          #
          # Quindi il tunnel deve coprire ANCHE l'avvio del provider. Resta
          # su di qui, e lo abbassa main.py appena i download sono finiti:
          # cinque minuti di esposizione invece di cinquanta, che era il
          # punto di partenza.
          if [ "$alzato" = "1" ]; then
            echo "WARP_PRONTO=1" >> "$GITHUB_ENV"
            echo "WARP_SU=1" >> "$GITHUB_ENV"
            echo "Tunnel SU: copre l'avvio del PO token provider e lo scarico, poi lo abbassa main.py"
            exit 0
          fi
          # Se nessuno dei tre dispositivi regge, si toglie di mezzo il
          # profilo: meglio un download che fallisce dicendo "YouTube mi
          # blocca" che un tunnel malato alzato in mezzo al lavoro.
          sudo rm -f /etc/wireguard/warp.conf
          echo "WARP_PRONTO=0" >> "$GITHUB_ENV"
          echo "::warning::WARP non e utilizzabile dopo tre tentativi: profilo rimosso"
          exit 1

      - name: Avvisa se WARP non e in piedi
        if: ${{ github.event.inputs.senza_warp != '1' && steps.warp.outcome != 'success' }}
        run: |
          echo "::warning::WARP non si e alzato: il download da YouTube "\
            "probabilmente fallira e il run finira senza clip."

      # Deno: motore JavaScript che yt-dlp usa per risolvere le sfide
      # anti-bot di YouTube (senza, il download è bloccato)
      # SOLO L'AVVIO, non la compilazione. Se la cache non c'e, il clone da
      # GitHub e npm ci vanno fatti PRIMA del tunnel — dentro si piantano,
      # come e successo a Deno nella run 110. La compilazione sta nel passo
      # "Compila il PO token provider", su in alto con gli altri download.
      - name: Avvia PO token provider
        run: |
          if [ ! -f /tmp/bgutil/server/build/main.js ]; then
            echo "::warning::PO token provider non compilato: yt-dlp provera senza"
            exit 0
          fi
          cd /tmp/bgutil/server && nohup node build/main.js > /tmp/pot-server.log 2>&1 &
          sleep 3
          tail -2 /tmp/pot-server.log

      - name: Ingest nuovi video
        working-directory: reels-factory
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Serve in LETTURA: prima di scegliere le clip, il sistema rilegge
          # quante views hanno fatto quelle gia uscite, per non riproporre un
          # taglio gia morto. Senza token quel controllo restava fermo alla
          # scheda vecchia e nei log compariva "Storico non aggiornato".
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          # Apify scarica i video al posto nostro (YouTube blocca gli IP
          # dei runner GitHub); pochi centesimi a video, coperti dal piano free
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Piano B che funziona sempre: cartella Google Drive dove il team
          # carica il file master del video
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          # Spezzoni di film nelle clip (facoltativi):
          # - clip.cafe (abbonamento PRO)
          CLIPCAFE_API_KEY: ${{ secrets.CLIPCAFE_API_KEY }}
          # - oppure gratis: ricerca scene su YouTube (YouTube Data API v3,
          #   chiave gratuita da Google Cloud Console) + download via Apify
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Opzionale: cookie YouTube (cookies.txt) per tentare prima il
          # download diretto gratuito
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          # Opzionale ma risolutivo: proxy residenziale (http://utente:pass@host:porta).
          # Con questo il download diretto funziona senza passare da Apify.
          YT_PROXY: ${{ secrets.YT_PROXY }}
          BATCH_CLIPS: ${{ inputs.clips_per_video }}
          BATCH_FORCE_ARCHIVE: ${{ inputs.force_archive }}
        run: python -m src.main ingest

      # Il 2 settembre questo passo ha buttato via cinque clip gia montate e
      # gia caricate su R2: staged solo queue.json, ma il run aveva riscritto
      # anche state/prestazioni.md (la scheda dei risultati veri, che si
      # aggiorna a ogni giro perche le views cambiano). Con quel file sporco
      # "git pull --rebase" si rifiuta di partire — "You have unstaged
      # changes" — e il job muore DOPO aver fatto tutto il lavoro. Cinque
      # notti buttate cosi, e la coda arrivata a zero.
      #
      # Due difese, non una.
      #
      # 1) Si commette TUTTO cio che il run scrive dentro state/, cosi non
      #    resta niente di sporco a bloccare il salvataggio.
      # 2) Se il push viene rifiutato perche main e andato avanti, non si
      #    rebasa: si riparte dallo stato di GitHub e ci si rifonde sopra il
      #    proprio lavoro con "src.main fondi", che sa cosa significano i
      #    campi. Il rebase su queue.json e stato provato in un repo di prova
      #    il 4/09 e finisce in CONFLICT: git tenta di fondere un JSON riga
      #    per riga, si pianta a meta e avvelena anche il tentativo dopo.
      - name: Commit dello stato aggiornato
        run: |
          git config user.name "reels-factory-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A reels-factory/state
          if git diff --cached --quiet; then
            echo "Nessuna modifica allo stato"
            exit 0
          fi
          cp -r reels-factory/state /tmp/nostro-state
          git commit -m "Reels Factory: stato aggiornato dopo ingest [skip ci]"
          for tentativo in 1 2 3; do
            if git push; then
              echo "Stato salvato al tentativo ${tentativo}"
              exit 0
            fi
            echo "Push rifiutato: riparto dallo stato di GitHub e ci rifondo il lavoro"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/nostro-state/prestazioni.md reels-factory/state/prestazioni.md
            (cd reels-factory && python -m src.main fondi /tmp/nostro-state/queue.json) || exit 1
            git add -A reels-factory/state
            git diff --cached --quiet && echo "Niente da aggiungere" && exit 0
            git commit -m "Reels Factory: stato aggiornato dopo ingest [skip ci]"
            sleep $((tentativo * 5))
          done
          echo "::error::Le clip sono su R2 ma la coda non e stata salvata"
          exit 1
