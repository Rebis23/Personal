# ============================================================
# Reels Factory — configurazione
# Pipeline: nuovo video YouTube → clip verticali sottotitolate → Reels Instagram
# I segreti (token, chiavi) NON vanno qui: vanno nei GitHub Secrets.
# ============================================================

youtube:
  # ID del canale (inizia con "UC..."). Si trova in: YouTube Studio →
  # Impostazioni → Canale → Impostazioni avanzate, oppure nell'URL del canale.
  channel_id: "UC0sLHvRLSH1M-u_Hn12lMew"   # canale Lorenzo Ricchieri
  # Ignora video più vecchi di N giorni (evita di processare tutto l'archivio
  # alla prima esecuzione)
  max_age_days: 14
  # Sotto questa durata il video è considerato uno Short e viene ignorato
  min_duration_seconds: 180

apify:
  # Qualità del video scaricato via Apify (il download diretto da YouTube è
  # bloccato dai runner GitHub; Apify lo fa per noi a pochi centesimi a video)
  video_quality: "1080p"

whisper:
  # Modello di trascrizione: "small" = veloce (~5-10 min per un video da 20'),
  # "medium" = più preciso ma ~2-3x più lento
  model: "small"

clips:
  # Quante clip estrarre da ogni video
  # Raddoppiate il 29/08 su richiesta di Lorenzo. Non sono 6 momenti presi
  # in fila: Claude ne individua 12-15, li vota sui cinque assi e monta solo
  # i migliori. Se un video non ne ha 6 che superano la soglia, ne escono meno.
  per_video: 6
  # Somma minima dei cinque assi (bersaglio, numero, ribaltamento, tu,
  # tensione) perche una clip venga montata. Su 15.
  punteggio_minimo: 7
  min_seconds: 20
  max_seconds: 75
  # "square" = video ritagliato quadrato su sfondo nero, persona al centro
  #            (stile Modern Wisdom — scelto da Lorenzo il 15/08)
  # "blur"   = video originale centrato su sfondo sfocato
  # "crop"   = ritaglio centrale 9:16 a pieno schermo
  vertical_mode: "square"
  # Raggio degli angoli arrotondati del riquadro video (0 = spigoli vivi)
  corner_radius: 96
  # Lento zoom-in progressivo (0 = disattivato — scelta di Lorenzo)
  zoom: 0
  # Motore delle caption: "remotion" (premium, animato) con fallback
  # automatico su "ass" (classico) se Remotion non è disponibile
  renderer: "remotion"
  # Banner bianco con l'hook (testo nero) sopra la testa di chi parla.
  # seconds: 0 = visibile per tutta la clip
  hook_card: true
  hook_card_seconds: 0
  # Cold open: la frase piu tagliente della clip viene estratta e montata in
  # apertura, poi stacco e la clip riparte dal suo inizio. Claude la sceglie
  # solo quando regge da sola fuori contesto.
  cold_open: true
  cold_open_max_seconds: 6

subtitles:
  # "word"    = una parola alla volta, grande, centrata (stile Modern Wisdom)
  # "karaoke" = gruppi di parole con evidenziazione progressiva
  style: "word"
  # Font scelto da Lorenzo (file in assets/fonts). Alternative pronte:
  # "Fredoka", "Baloo 2 ExtraBold", "Rounded Mplus 1c ExtraBold", "Nunito"
  font: "Instrument Sans"
  # Grande e importante (gruppi di 2-3 parole per schermata)
  font_size: 128
  # true = PAROLE IN MAIUSCOLO, false = come pronunciate
  uppercase: false
  # Colori in formato ASS &HBBGGRR& (BGR!)
  base_color: "&HFFFFFF&"        # bianco
  highlight_color: "&H00FFFF&"   # giallo (usato solo dallo stile karaoke)
  # Parole per schermata (stile word) / per riga (stile karaoke)
  words_per_line: 1
  # Posizione verticale del testo (0 = alto, 1 = basso).
  # 0.68 = sul petto, dentro il riquadro ma sotto il viso
  vertical_position: 0.68

audio:
  # Sound design: base musicale in sottofondo (file bed-*.mp3 in assets/audio,
  # in loop, dissolvenza finale). Per aggiungere musica tua: metti gli mp3
  # lì con nome bed-<nome>.mp3 — la scelta ruota da clip a clip.
  music: true
  # Volume della musica rispetto alla voce (dB)
  music_gain_db: -20
  # La musica si abbassa da sola quando parli (sidechain compression)
  ducking: true
  # Effetto whoosh all'ingresso dello spezzone film
  whoosh_on_cutaway: true
  # Colpo soft quando appare una parola enfatizzata
  pop_on_emphasis: true

movies:
  # Spezzoni di film pertinenti nelle clip. Due sorgenti possibili:
  # - "clipcafe": https://clip.cafe (abbonamento PRO ~5$/mese, secret CLIPCAFE_API_KEY)
  # - "youtube":  gratis — cerca la scena sui canali movie-clips di YouTube
  #               (secret YOUTUBE_API_KEY, chiave gratuita di Google Cloud),
  #               la scarica via Apify e trova il momento esatto con Whisper
  # Usa la prima sorgente configurata nell'ordine indicato qui:
  enabled: true
  sources: ["clipcafe", "youtube"]
  # Durata massima dello spezzone sovraimpresso
  max_seconds: 5

archive:
  # Quando non escono video nuovi e la coda si svuota, il sistema ripesca dai
  # video passati del canale: così il profilo non resta mai fermo.
  enabled: true
  # Quanti video d'archivio recuperare in tutto. Alzato da 5 a 12 il 25/08:
  # con una lavorazione ogni 3 giorni, 5 video coprivano solo due settimane e
  # poi il profilo si sarebbe fermato. Nel feed del canale ce ne sono 15.
  max_videos: 12
  # Minimo di giorni tra una lavorazione d'archivio e la successiva.
  # 3 giorni × 3 clip per video = una pubblicazione al giorno senza buchi
  # (richiesta di Lorenzo del 25/08, sostituisce il "max un video a settimana")
  min_days_between: 3
  # Si pesca dall'archivio solo se in coda restano al massimo N clip
  queue_below: 1

instagram:
  # Profilo PERSONALE: niente hashtag di brand o promozionali. Gli hashtag
  # tematici li sceglie Claude clip per clip, in base a ciò che si dice.
  default_hashtags: ""
  # Firma opzionale aggiunta a ogni caption (lascia vuoto per disattivare)
  caption_footer: ""
  # true = pubblica davvero; false = fa tutto tranne la pubblicazione (test)
  # ✅ Attivato il 15/08 sera su ok di Lorenzo: 1 Reel al giorno alle 11:30
  auto_publish: true
  # Finestra oraria in cui è consentito pubblicare (ora italiana, estremi
  # inclusi sull'inizio ed esclusi sulla fine). GitHub consegna le esecuzioni
  # programmate con ritardi anche di otto ore: il 29/08 il turno delle 19:30 è
  # arrivato alle 3:08 di notte e il Reel è uscito mentre non lo vedeva
  # nessuno. Fuori finestra la pubblicazione si ferma e il turno successivo la
  # recupera; l'esecuzione manuale con "force" ignora questo controllo.
  ore_pubblicazione: [7, 22]

claude:
  model: "claude-opus-5"
  # Istruzioni extra per la selezione delle clip (tono, cosa cercare).
  # Claude riceve anche il contesto brand qui sotto.
  brand_context: |
    Brand: Media Profit (mediaprofit.it), fondatore Lorenzo Ricchieri.
    Target: liberi professionisti italiani (coach, consulenti, formatori)
    35-45 anni che vogliono acquisire clienti high-ticket tramite YouTube
    invece di sfinirsi con reels e storie su Instagram.
    Tono: iperrealismo, verità diretta, no fuffa, no promesse miracolose,
    mai da guru. Angoli che funzionano: "le views non pagano le bollette",
    stanchezza da contenuti quotidiani, qualità dei lead, autorità di settore.
    Le clip migliori sono: momenti con un'affermazione forte o contrarian,
    un dato concreto, una storia di cliente, o la demolizione di un mito.

nicchia:
  # I filoni su cui cercare i video brevi forti. Non sono hashtag: sono
  # domande, come le farebbe una persona. Servono a SCOPRIRE i canali della
  # nicchia: da li si va a vedere la loro scheda Shorts. Cosi la nicchia si
  # ridefinisce da sola ogni settimana invece di restare una lista fissa.
  ricerche:
    - "mentalita vincente"
    - "psicologia comportamento umano"
    - "abitudini disciplina risultati"
    - "crescita personale verita scomode"
    - "perche non ottieni risultati"
    - "come cambiare mentalita imprenditore"
    - "psicologia soldi e successo"
    - "smettere di procrastinare disciplina"
  # Quanti risultati leggere per ogni filone. Servono solo a raccogliere nomi
  # di canali, quindi non serve esagerare.
  per_ricerca: 25
  # Quanti canali spogliare al massimo. Ognuno costa una chiamata piu due
  # secondi di pausa: quaranta canali sono circa dieci minuti.
  canali_max: 40
  # Quanti Shorts leggere per canale. E su questi che si calcola la mediana,
  # cioe il "normale" di quel creator: misurato, con trenta si trovavano un
  # terzo degli outlier che si trovano con sessanta.
  shorts_per_canale: 60
  # Quante volte un video deve aver superato la mediana del SUO canale per
  # entrare nell'analisi. E il filtro che separa "costruito bene" da
  # "pubblicato da un canale grosso".
  scarto_minimo: 3.0
  # Sotto questa mediana il canale si salta: su venticinque views a video, il
  # video da trecento e "dodici volte la mediana" e non ha insegnato niente a
  # nessuno. Il rapporto misurerebbe il caso, non la costruzione.
  mediana_minima: 500
  # E la controprova assoluta: un moltiplicatore alto su numeri piccoli resta
  # un numero piccolo. Qui vogliamo video che hanno raggiunto davvero qualcuno.
  # Tremila e tarato sulla nicchia italiana, che e piccola: a cinquemila il
  # campione scendeva a quattordici video, troppo pochi per vedere uno schema.
  views_minime: 3000
  # Quanti outlier al massimo puo mettere un singolo canale. Serve, e non e
  # teoria: al primo giro dieci dei primi tredici erano dello stesso creator,
  # che intitola tutto "10 frasi sulla forza", e la scuola ne aveva ricavato
  # che il pubblico italiano vuole le liste numerate. Non e una legge della
  # nicchia: e l'abitudine di un signore.
  per_canale_max: 4
