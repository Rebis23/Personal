# ============================================================
# Reels Factory — configurazione
# Pipeline: nuovo video YouTube → clip verticali sottotitolate → Reels Instagram
# I segreti (token, chiavi) NON vanno qui: vanno nei GitHub Secrets.
# ============================================================

youtube:
  # ID del canale (inizia con "UC..."). Si trova in: YouTube Studio →
  # Impostazioni → Canale → Impostazioni avanzate, oppure nell'URL del canale.
  channel_id: "UC0sLHvRLSH1M-u_Hn12lMew"   # canale Lorenzo Ricchieri
  # Ignora video più vecchi di N giorni (evita di processare tutto l'archivio
  # alla prima esecuzione)
  max_age_days: 14
  # Sotto questa durata il video è considerato uno Short e viene ignorato
  min_duration_seconds: 180

apify:
  # Qualità del video scaricato via Apify (il download diretto da YouTube è
  # bloccato dai runner GitHub; Apify lo fa per noi a pochi centesimi a video)
  video_quality: "1080p"

whisper:
  # Modello di trascrizione: "small" = veloce (~5-10 min per un video da 20'),
  # "medium" = più preciso ma ~2-3x più lento
  model: "small"

clips:
  # Quante clip estrarre da ogni video
  per_video: 3
  min_seconds: 20
  max_seconds: 75
  # "square" = video ritagliato quadrato su sfondo nero, persona al centro
  #            (stile Modern Wisdom — scelto da Lorenzo il 15/08)
  # "blur"   = video originale centrato su sfondo sfocato
  # "crop"   = ritaglio centrale 9:16 a pieno schermo
  vertical_mode: "square"

subtitles:
  # "word"    = una parola alla volta, grande, centrata (stile Modern Wisdom)
  # "karaoke" = gruppi di parole con evidenziazione progressiva
  style: "word"
  # Nunito Black: font tondo e pieno, incluso nel repo (assets/fonts)
  font: "Nunito"
  font_size: 112
  # true = PAROLE IN MAIUSCOLO, false = come pronunciate
  uppercase: false
  # Colori in formato ASS &HBBGGRR& (BGR!)
  base_color: "&HFFFFFF&"        # bianco
  highlight_color: "&H00FFFF&"   # giallo (usato solo dallo stile karaoke)
  # Parole per riga (solo stile karaoke)
  words_per_line: 3
  # Posizione verticale del testo (0 = alto, 1 = basso). 0.5 = centro.
  vertical_position: 0.5

clipcafe:
  # Spezzoni di film pertinenti (https://clip.cafe, abbonamento PRO ~5$/mese).
  # Si attiva da solo quando il secret CLIPCAFE_API_KEY è configurato.
  enabled: true
  # Durata massima dello spezzone sovraimpresso
  max_seconds: 5

instagram:
  # Aggiunti in coda alla caption generata da Claude
  default_hashtags: "#mediaprofit #youtube #personalbrand #acquisizioneclienti #liberiprofessionisti"
  # Firma opzionale aggiunta a ogni caption (lascia vuoto per disattivare)
  caption_footer: ""
  # true = pubblica davvero; false = fa tutto tranne la pubblicazione (test)
  # ⚠️ MODALITÀ PROVA attiva per il collaudo iniziale: rimettere true dopo l'ok
  auto_publish: false

claude:
  model: "claude-opus-5"
  # Istruzioni extra per la selezione delle clip (tono, cosa cercare).
  # Claude riceve anche il contesto brand qui sotto.
  brand_context: |
    Brand: Media Profit (mediaprofit.it), fondatore Lorenzo Ricchieri.
    Target: liberi professionisti italiani (coach, consulenti, formatori)
    35-45 anni che vogliono acquisire clienti high-ticket tramite YouTube
    invece di sfinirsi con reels e storie su Instagram.
    Tono: iperrealismo, verità diretta, no fuffa, no promesse miracolose,
    mai da guru. Angoli che funzionano: "le views non pagano le bollette",
    stanchezza da contenuti quotidiani, qualità dei lead, autorità di settore.
    Le clip migliori sono: momenti con un'affermazione forte o contrarian,
    un dato concreto, una storia di cliente, o la demolizione di un mito.
